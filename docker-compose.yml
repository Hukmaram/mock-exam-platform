version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mockexam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mockexam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockexam"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mockexam-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mockexam?schema=public
      JWT_SECRET: super-secret-jwt-token-key-min-32-chars-mock-exam
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      RAZORPAY_KEY_ID: rzp_test_mockkey12345
      RAZORPAY_KEY_SECRET: mock_secret_key_67890
      RAZORPAY_WEBHOOK_SECRET: mock_webhook_secret_abc123
      RAZORPAY_TEST_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mockexam-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_mockkey12345
    depends_on:
      - backend

volumes:
  postgres_data:
